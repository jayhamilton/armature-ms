<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Armature Charts</title>
<style>
  /* Same deliberate always-on gradient look as board-summary.html, for a
     consistent Armature MCP App identity regardless of host theme. */
  :root {
    --fg: #f5f3ff;
    --fg-muted: #c7bcec;
    --border: rgba(255, 255, 255, 0.18);
    --card-bg: rgba(255, 255, 255, 0.08);
    --pill-bg: rgba(255, 255, 255, 0.14);
    --accent: #b39ddb;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: linear-gradient(135deg, #2a1458 0%, #20296b 55%, #0a0e2e 100%);
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  header p {
    margin: 0;
    font-size: 12px;
    color: var(--fg-muted);
  }
  .badge {
    flex: 0 0 auto;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .chart-wrap {
    position: relative;
    height: 280px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .empty-state {
    margin: 0;
    padding: 32px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--fg-muted);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="chart-title">Loading chart&hellip;</h1>
    <p id="chart-meta"></p>
  </div>
  <span class="badge" id="presentation-badge" hidden></span>
</header>
<div class="chart-wrap">
  <canvas id="chart-canvas"></canvas>
</div>
<p class="empty-state" id="empty-state" hidden>No chart data yet &mdash; ask the assistant to chart something.</p>

);
const { App, applyDocumentTheme } = bundle;

const titleEl = document.getElementById("chart-title");
const metaEl = document.getElementById("chart-meta");
const badgeEl = document.getElementById("presentation-badge");
const canvas = document.getElementById("chart-canvas");
const emptyEl = document.getElementById("empty-state");

const PALETTE = ["#b39ddb", "#80cbc4", "#ffab91", "#90caf9", "#f48fb1", "#c5e1a5"];

let chartInstance = null;

function toChartConfig(data) {
  const chartType = data.chartType || "bar";
  const labels = data.labels || [];
  const series = data.series || [];

  const datasets = (chartType === "pie" ? series.slice(0, 1) : series).map((s, i) => {
    const color = PALETTE[i % PALETTE.length];
    const dataset = {
      label: s.name || `Series ${i + 1}`,
      data: s.values || [],
      borderColor: color,
      backgroundColor: chartType === "pie"
        ? labels.map((_, j) => PALETTE[j % PALETTE.length])
        : (chartType === "area" ? color + "40" : color),
    };
    if (chartType === "area") {
      dataset.fill = true;
      dataset.tension = 0.35;
    }
    return dataset;
  });

  const axisTicks = { color: "#c7bcec" };
  const axisGrid = { color: "rgba(255, 255, 255, 0.08)" };

  return {
    // Chart.js has no separate "area" chart - it's a line chart with fill enabled.
    type: chartType === "area" ? "line" : chartType,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "#f5f3ff" } },
      },
      scales: chartType === "pie" ? {} : {
        x: { ticks: axisTicks, grid: axisGrid },
        y: { ticks: axisTicks, grid: axisGrid },
      },
    },
  };
}

function render(data) {
  const hasData = !!(data && Array.isArray(data.labels) && data.labels.length
    && Array.isArray(data.series) && data.series.length);

  titleEl.textContent = (data && data.title) || "Chart";
  metaEl.textContent = hasData
    ? `${data.series.length} series across ${data.labels.length} categories`
    : "Ask the assistant to chart something to see it here.";

  badgeEl.hidden = !hasData;
  if (hasData) {
    badgeEl.textContent = data.presentation === "dashboard_gadget" ? "Dashboard gadget" : "Chat response";
  }

  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  canvas.hidden = !hasData;
  emptyEl.hidden = hasData;
  if (hasData) {
    chartInstance = new Chart(canvas.getContext("2d"), toChartConfig(data));
  }
}

const app = new App({ name: "Armature Charts", version: "1.0.0" });

app.ontoolresult = (result) => {
  const data = result.structuredContent || {};
  render(data);
  // Reflects the elicited presentation choice as an actual ui/request-display-mode
  // call, not just local chrome - pip is the closest real display mode to a
  // persistent "dashboard gadget" this SDK offers. Best-effort: hosts that don't
  // support the requested mode may leave it unchanged, and this doesn't await or
  // surface that outcome since the rendered chart is already correct either way.
  const mode = data.presentation === "dashboard_gadget" ? "pip" : "inline";
  app.requestDisplayMode({ mode }).catch(() => {});
};

app.onhostcontextchanged = (ctx) => {
  if (ctx.theme) applyDocumentTheme(ctx.theme);
};

app.onerror = (err) => console.error("[armature charts app]", err);

app.connect().then(() => {
  const ctx = app.getHostContext();
  if (ctx && ctx.theme) applyDocumentTheme(ctx.theme);
});
