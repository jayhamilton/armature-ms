spring.application.name=ngxdd
info.app.name=NGX Dynamic Dashboard Framework - Microservice
info.app.description=Backend service for the Angular NGX Dynamic Dashboard Framework, including the REST/A2UI chat assistant API.
info.app.version=@project.version@

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
