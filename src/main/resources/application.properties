spring.application.name=armature-ms
info.app.name=Armature Microservice
info.app.description=Backend service for Armature, including the REST/A2UI chat assistant API.
info.app.version=@project.version@

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:4b
spring.ai.ollama.init.pull-model-strategy=when_missing

# Which provider's autoconfiguration supplies the primary ChatModel bean used for
# the main conversational/tool-calling client (AgentService.chatClient). Ollama and
# Anthropic starters are both on the classpath; this property is what Spring AI uses
# to pick exactly one (their autoconfigurations are mutually exclusive on it, not
# just "primary among several"), so only one of them is ever actually active.
# Set AGENT_CHAT_MODEL=anthropic to compare against a hosted model instead of the
# local one - requires ANTHROPIC_API_KEY to be set too. Which Claude model is used
# is left to Spring AI's own built-in default rather than pinned here (an empty
# default here would set spring.ai.anthropic.chat.model to "" and override it with
# nothing valid); override via the SPRING_AI_ANTHROPIC_CHAT_MODEL env var directly
# if a different one is needed - Spring Boot binds that to the property on its own,
# no explicit line required here for it to work.
# The schema-constrained structured-output call AgentService uses to populate
# add_gadget's property values is Ollama-specific either way (see
# enrichAddGadgetPartsWithPropertyValues) and quietly skips itself when this isn't
# "ollama", rather than trying to run on whichever provider is currently active.
spring.ai.model.chat=${AGENT_CHAT_MODEL:ollama}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# A2A's autoconfiguration only needed a ChatClient bean to activate, which
# didn't exist before Ollama was wired in. It still needs AgentCard and
# AgentExecutor beans (a separate, not-yet-done piece of work; see
# AGENTIC_PROTOCOLS.md) so excluded here rather than left to fail app boot.
spring.autoconfigure.exclude=org.springaicommunity.a2a.server.autoconfigure.A2AServerAutoConfiguration
